<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#122D40"/><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif;fill:#E9F2F2}.main{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#B4CBD3}.small{font-size:14px}</style><text x="42" y="54" class="main">白石城 V1.7｜夏季雨季与初秋退雨季</text><text x="42" y="85" class="sub">模拟样本，不是正式实测；月份使用前期资料的类地球编号</text><rect x="45" y="115" width="531" height="199" rx="11" fill="#24516A"/><rect x="591" y="115" width="564" height="199" rx="11" fill="#564A43"/><text x="70" y="156" font-size="23" font-weight="700">盛夏 · 6—8月</text><text x="70" y="197" font-size="20">平均约21—22°C</text><text x="70" y="235" font-size="18">降水累计250mm / 年总量的56%</text><text x="70" y="273" class="sub">多云、降水和蒸发冷却抑制升温</text><text x="616" y="156" font-size="23" font-weight="700">初秋 · 9月</text><text x="616" y="197" font-size="20">模拟均温26°C</text><text x="616" y="235" font-size="18">9月降水降至25mm</text><text x="616" y="273" class="sub">退雨、晴空与局地背风下沉增温</text><rect x="45" y="338" width="1110" height="239" rx="11" fill="#1B4155"/><path d="M70 535H1060" stroke="#7FA2B1" stroke-opacity=".4" stroke-dasharray="5 7"/><path d="M70 495H1060" stroke="#7FA2B1" stroke-opacity=".4" stroke-dasharray="5 7"/><path d="M70 455H1060" stroke="#7FA2B1" stroke-opacity=".4" stroke-dasharray="5 7"/><path d="M70 415H1060" stroke="#7FA2B1" stroke-opacity=".4" stroke-dasharray="5 7"/><path d="M70 375H1060" stroke="#7FA2B1" stroke-opacity=".4" stroke-dasharray="5 7"/><rect x="85" y="506.2" width="34" height="28.799999999999997" rx="3" fill="#88BFD0"/><rect x="163" y="499" width="34" height="36" rx="3" fill="#88BFD0"/><rect x="241" y="477.4" width="34" height="57.599999999999994" rx="3" fill="#88BFD0"/><rect x="319" y="458.2" width="34" height="76.8" rx="3" fill="#88BFD0"/><rect x="397" y="415" width="34" height="120" rx="3" fill="#88BFD0"/><rect x="475" y="357.4" width="34" height="177.6" rx="3" fill="#88BFD0"/><rect x="553" y="328.6" width="34" height="206.4" rx="3" fill="#88BFD0"/><rect x="631" y="319" width="34" height="216" rx="3" fill="#88BFD0"/><rect x="709" y="475" width="34" height="60" rx="3" fill="#88BFD0"/><rect x="787" y="496.6" width="34" height="38.4" rx="3" fill="#88BFD0"/><rect x="865" y="506.2" width="34" height="28.799999999999997" rx="3" fill="#88BFD0"/><rect x="943" y="511" width="34" height="24" rx="3" fill="#88BFD0"/><polyline points="102,507 180,493 258,451 336,402 414,367 492,353 570,346 648,353 726,318 804,367 882,430 960,486" fill="none" stroke="#F4C07B" stroke-width="4"/><circle cx="102" cy="507" r="4" fill="#F4C07B"/><circle cx="180" cy="493" r="4" fill="#F4C07B"/><circle cx="258" cy="451" r="4" fill="#F4C07B"/><circle cx="336" cy="402" r="4" fill="#F4C07B"/><circle cx="414" cy="367" r="4" fill="#F4C07B"/><circle cx="492" cy="353" r="4" fill="#F4C07B"/><circle cx="570" cy="346" r="4" fill="#F4C07B"/><circle cx="648" cy="353" r="4" fill="#F4C07B"/><circle cx="726" cy="318" r="4" fill="#F4C07B"/><circle cx="804" cy="367" r="4" fill="#F4C07B"/><circle cx="882" cy="430" r="4" fill="#F4C07B"/><circle cx="960" cy="486" r="4" fill="#F4C07B"/><text x="102" y="558" text-anchor="middle" font-size="13">1月</text><text x="180" y="558" text-anchor="middle" font-size="13">2月</text><text x="258" y="558" text-anchor="middle" font-size="13">3月</text><text x="336" y="558" text-anchor="middle" font-size="13">4月</text><text x="414" y="558" text-anchor="middle" font-size="13">5月</text><text x="492" y="558" text-anchor="middle" font-size="13">6月</text><text x="570" y="558" text-anchor="middle" font-size="13">7月</text><text x="648" y="558" text-anchor="middle" font-size="13">8月</text><text x="726" y="558" text-anchor="middle" font-size="13">9月</text><text x="804" y="558" text-anchor="middle" font-size="13">10月</text><text x="882" y="558" text-anchor="middle" font-size="13">11月</text><text x="960" y="558" text-anchor="middle" font-size="13">12月</text><text x="835" y="369" font-size="15" fill="#9ED7E6">蓝柱：降水 mm</text><text x="835" y="393" font-size="15" fill="#F8D5A2">橙线：均温 °C</text><text x="55" y="604" class="sub">夏季平均值偏凉、初秋较热是既定气候性格；图中具体气温降水值尚属候选。</text></svg>