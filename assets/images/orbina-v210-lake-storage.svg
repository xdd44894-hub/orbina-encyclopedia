<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1025" viewBox="0 0 1740 1025" role="img" aria-label="俄庇娜V2.10四时段无湖盆与有湖盆总出水对比"><title>俄庇娜V2.10湖盆调蓄质量守恒</title><defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}.title{fill:#f1f5ed;font-size:37px;font-weight:700}.h{fill:#eff5eb;font-size:26px;font-weight:700}.info{fill:#bdd5db;font-size:20px}.small{fill:#d9e8e6;font-size:18px}</style></defs><rect width="1740" height="1025" fill="#092738"/>
 <text x="73" y="75" class="title">V2.10 · 湖泊如何延后河流的出水</text>
 <text x="73" y="117" class="info">四个假设时间段分别接受12%、50%、26%、12%的年降水权重；与真实日历无关</text>
 <rect x="85" y="160" width="24" height="21" fill="#99d0b6"/><text x="124" y="179" class="info">不设置调蓄节点</text>
 <rect x="442" y="160" width="24" height="21" fill="#a9b5e0"/><text x="480" y="179" class="info">设置两个人工湖盆节点</text>
 <text x="81" y="293" class="h">时段 1</text><rect x="138" y="260" height="31" width="314.40" rx="5" fill="#99d0b6"/><rect x="138" y="309" height="31" width="297.23" rx="5" fill="#a9b5e0"/><text x="464.4" y="283" class="small">229.5</text><text x="447.22505333612213" y="332" class="small">217.0</text><text x="81" y="462" class="h">时段 2</text><rect x="138" y="429" height="31" width="1310.00" rx="5" fill="#99d0b6"/><rect x="138" y="478" height="31" width="1243.25" rx="5" fill="#a9b5e0"/><text x="1460" y="452" class="small">956.2</text><text x="1393.2464442585233" y="501" class="small">907.5</text><text x="81" y="631" class="h">时段 3</text><rect x="138" y="598" height="31" width="681.20" rx="5" fill="#99d0b6"/><rect x="138" y="647" height="31" width="667.49" rx="5" fill="#a9b5e0"/><text x="831.2" y="621" class="small">497.2</text><text x="817.48747019452" y="670" class="small">487.2</text><text x="81" y="800" class="h">时段 4</text><rect x="138" y="767" height="31" width="314.40" rx="5" fill="#99d0b6"/><rect x="138" y="816" height="31" width="324.56" rx="5" fill="#a9b5e0"/><text x="464.4" y="790" class="small">229.5</text><text x="474.5644875549048" y="839" class="small">236.9</text>
 <text x="81" y="958" class="info">期末尚存的水量 63.85 模型单位 = 无湖盆总入海量 − 有湖盆总入海量</text>
 <text x="81" y="992" class="small">这是沿D8河道的四步水量核算，并非洪峰预报。湖盆位置、大小与调蓄规则都只是试验参数。</text>
