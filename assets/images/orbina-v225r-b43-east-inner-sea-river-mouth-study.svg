<text x="42" y="862" font-size="17" font-family="system-ui,Microsoft YaHei,sans-serif" font-weight="700" fill="#27505d">研究说明：</text>
<text x="155" y="862" font-size="16" font-family="system-ui,Microsoft YaHei,sans-serif" fill="#44616a">示意线仅表示在 B42 大陆陆地内能抵达相应海岸；并非依据真实 DEM 演算的河流。</text>
<text x="42" y="892" font-size="15" font-family="system-ui,Microsoft YaHei,sans-serif" fill="#67817f">B43 保留 B42 全部 99 片陆块、9690 个海岸线顶点；当前面板仅裁切展示主大陆的东岸局部。</text>
