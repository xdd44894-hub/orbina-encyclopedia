 <g><text x="105" y="238" class="section">宽缓陆架／弱波浪</text>
 <rect x="107" y="282" width="705.60" height="52" fill="#95c8a6"/>
 <rect x="812.60" y="282" width="78.40" height="52" fill="#e9c28e"/>
