 <text x="108" y="591" class="body">本地滞留 181.22；沿岸再分配 624.20；离岸输出 201.36</text></g><g><text x="105" y="668" class="section">强潮流／深槽海湾</text>
 <rect x="107" y="712" width="245.00" height="52" fill="#95c8a6"/>
