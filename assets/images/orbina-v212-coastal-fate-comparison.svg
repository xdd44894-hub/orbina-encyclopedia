<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-label="俄庇娜V2.12假设河口泥沙输入按三种海岸动力条件划分近河口滞留、沿岸输运和离岸输出的守恒对照"><title>V2.12 海岸动力与泥沙去向</title><defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}.ttl{font-size:38px;font-weight:700;fill:#f2f4e8}.sub{font-size:19px;fill:#b3cfd8}.section{font-size:27px;font-weight:700;fill:#eef3e9}.body{font-size:20px;fill:#d9e4de}.tiny{font-size:17px;fill:#b6ccd0}</style></defs><rect width="1600" height="1100" fill="#0b293a"/>
 <text x="85" y="89" class="ttl">俄庇娜 V2.12 · 同样的泥沙，不同的河口地貌</text>
 <text x="87" y="130" class="sub">基准混合下垫面 · 固定泥沙总供给 · 三种假设近岸过程（非真实洋流数据）</text>
