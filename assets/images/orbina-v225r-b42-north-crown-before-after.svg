<text x="38" y="1244" font-size="20" font-family="Microsoft YaHei,sans-serif" fill="#4e7478">B42：99片陆块、9,690个顶点；主大陆面状面积较旧版减少约1.225%，无新自相交。B16/B34–B41源文件全部可回退。</text><text x="38" y="1284" font-size="18" font-family="Microsoft YaHei,sans-serif" fill="#6a817f">注意：本图只证明平面海水连通，不代表海盆深度、通航条件、行政区划或正式国界。北冠工作称谓与25个正式海域名称均未新增或改变。</text></svg>