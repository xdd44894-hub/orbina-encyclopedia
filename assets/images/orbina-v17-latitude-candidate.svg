<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#122D40"/><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif;fill:#E9F2F2}.main{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#B4CBD3}.small{font-size:14px}</style><text x="42" y="54" class="main">俄庇娜 V1.7｜候选纬度与风带</text><text x="42" y="86" class="sub">仅为北半球类地球气候测试窗口，不是正式经纬度或政区坐标</text><rect x="60" y="117" width="812" height="453" rx="10" fill="#234657"/><rect x="85" y="447.6923076923077" width="759" height="92.30769230769232" fill="#2F6872" opacity=".66"/><rect x="85" y="355.38461538461536" width="759" height="92.30769230769232" fill="#6D7965" opacity=".66"/><rect x="85" y="232.30769230769232" width="759" height="123.07692307692304" fill="#4D7076" opacity=".66"/><rect x="85" y="140" width="759" height="92.30769230769232" fill="#5C7075" opacity=".66"/><line x1="85" y1="540" x2="844" y2="540" stroke="#C0DAE1" stroke-opacity=".55" stroke-dasharray="7 7"/><text x="76" y="545" font-size="13" text-anchor="end">0°N</text><line x1="85" y1="447.6923076923077" x2="844" y2="447.6923076923077" stroke="#C0DAE1" stroke-opacity=".55" stroke-dasharray="7 7"/><text x="76" y="452.6923076923077" font-size="13" text-anchor="end">15°N</text><line x1="85" y1="355.38461538461536" x2="844" y2="355.38461538461536" stroke="#C0DAE1" stroke-opacity=".55" stroke-dasharray="7 7"/><text x="76" y="360.38461538461536" font-size="13" text-anchor="end">30°N</text><line x1="85" y1="263.0769230769231" x2="844" y2="263.0769230769231" stroke="#C0DAE1" stroke-opacity=".55" stroke-dasharray="7 7"/><text x="76" y="268.0769230769231" font-size="13" text-anchor="end">45°N</text><line x1="85" y1="170.76923076923077" x2="844" y2="170.76923076923077" stroke="#C0DAE1" stroke-opacity=".55" stroke-dasharray="7 7"/><text x="76" y="175.76923076923077" font-size="13" text-anchor="end">60°N</text><line x1="85" y1="140" x2="844" y2="140" stroke="#C0DAE1" stroke-opacity=".55" stroke-dasharray="7 7"/><text x="76" y="145" font-size="13" text-anchor="end">65°N</text><rect x="216" y="176.9230769230769" width="82" height="270.7692307692308" rx="7" fill="#BDD5AD" fill-opacity=".25" stroke="#BDD5AD" stroke-dasharray="8 5" stroke-width="2"/><text x="257" y="467.6923076923077" font-size="16" text-anchor="middle">超级大陆</text><rect x="390" y="256.9230769230769" width="82" height="104.61538461538464" rx="7" fill="#F2D09B" fill-opacity=".25" stroke="#F2D09B" stroke-dasharray="8 5" stroke-width="2"/><text x="431" y="381.53846153846155" font-size="16" text-anchor="middle">秦棠</text><rect x="564" y="306.1538461538462" width="82" height="92.30769230769226" rx="7" fill="#DFB69A" fill-opacity=".25" stroke="#DFB69A" stroke-dasharray="8 5" stroke-width="2"/><text x="605" y="418.46153846153845" font-size="16" text-anchor="middle">萨瑞拉</text><rect x="738" y="275.38461538461536" width="82" height="67.69230769230774" rx="7" fill="#A5D9DF" fill-opacity=".25" stroke="#A5D9DF" stroke-dasharray="8 5" stroke-width="2"/><text x="779" y="363.0769230769231" font-size="16" text-anchor="middle">白石城</text><path d="M96 260H197L184 253M197 260L184 267" stroke="#B7E1E9" fill="none" stroke-width="3"/><path d="M840 471H713L727 464M713 471L727 478" stroke="#F1D09E" fill="none" stroke-width="3"/><rect x="890" y="117" width="273" height="453" rx="11" fill="#1A394B"/><text x="915" y="160" font-size="20" font-weight="700">建模仍需确认</text><text x="915" y="203" class="small">• 自转周期、轴倾角</text><text x="915" y="246" class="small">• 公转年和本地历法</text><text x="915" y="289" class="small">• 海陆经纬位置</text><text x="915" y="332" class="small">• 洋流与海温</text><text x="915" y="375" class="small">• 山脉与分水岭</text><text x="915" y="433" class="sub">纬度跨度仅用于检查：</text><text x="915" y="459" class="sub">冷冬、夏季多云、</text><text x="915" y="485" class="sub">内海增湿是否兼容。</text><text x="62" y="603" class="sub">示意纬线不能投影回V1.3非等比例大陆图；白石城和各国的绝对纬度仍未正式设定。</text></svg>