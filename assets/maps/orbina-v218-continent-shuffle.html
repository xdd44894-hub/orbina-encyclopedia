<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>俄庇娜 · 随机排列大陆</title>

<header><h1>俄庇娜 · 八片大陆随机排列实验</h1><p>三组排列都是从现有候选大陆轮廓中生成；中央超级大陆与南部内海的既有结构不变。</p></header>
<main><h2>先比较三种方案</h2><div class="cards">
<article class="card"><h2>A｜群陆分散</h2><a href="../images/orbina-v218-random-layout-a.svg" target="_blank"><img src="../images/orbina-v218-random-layout-a.svg" alt="A｜群陆分散 大陆布局" ></a><p><a href="../images/orbina-v218-random-layout-a.svg" target="_blank">查看原图</a></p></article><article class="card"><h2>B｜错列大陆</h2><a href="../images/orbina-v218-random-layout-b.svg" target="_blank"><img src="../images/orbina-v218-random-layout-b.svg" alt="B｜错列大陆 大陆布局" loading="lazy"></a><p><a href="../images/orbina-v218-random-layout-b.svg" target="_blank">查看原图</a></p></article><article class="card"><h2>C｜不对称洋盆</h2><a href="../images/orbina-v218-random-layout-c.svg" target="_blank"><img src="../images/orbina-v218-random-layout-c.svg" alt="C｜不对称洋盆 大陆布局" loading="lazy"></a><p><a href="../images/orbina-v218-random-layout-c.svg" target="_blank">查看原图</a></p></article>
</div><h2>还想随机一次？</h2><p>下方的大陆每点一次就重新安排。这里只会临时改变图像，你可以把满意的一版保存成 SVG。</p>

<div class="live"><object id="atlas" type="image/svg+xml" data="../images/orbina-v218-random-layout-a.svg" aria-label="可随机重排的大陆地图"></object></div>
</main><footer>排列仅作为未定地理方案，图面比例、海洋归属、国界、气候与板块构造仍未确认。</footer>

document.getElementById("reroll").addEventListener("click",function(){if(!svg){status.textContent="地图还未加载。";return;}const order=pieces.slice();for(let i=7;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
