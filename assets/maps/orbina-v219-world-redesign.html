<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>俄庇娜 · 自然地理主图重构候选</title>
<style>:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:#0a2535;color:#f0f1e7}header{background:#0f3444;border-bottom:1px solid #486d7e;padding:25px}h1{font-size:clamp(23px,3vw,35px);margin:0}p{color:#bdd6d6;line-height:1.6}.main{padding:20px;max-width:1600px;margin:auto}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 20px}button,a.action{font:inherit;color:#ecf4e8;background:#21546a;border:1px solid #668999;border-radius:7px;cursor:pointer;padding:10px 16px;text-decoration:none}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#123748;border:1px solid #577b8c;border-radius:13px;overflow:hidden}.panel h2{font-size:21px;padding:0 16px}.panel img,.panel object{display:block;width:100%;height:auto;aspect-ratio:2400/2780;object-fit:contain}.old img{aspect-ratio:2400/2600}.caption{font-size:13px;padding:10px 16px;color:#b8d0d4}.toggles{margin:18px 0;padding:16px;border:1px solid #507e8a;background:#14394b;border-radius:11px}.toggles label{display:inline-flex;gap:8px;align-items:center;padding:8px}input{accent-color:#a8d2b0}footer{margin-top:20px;padding:19px;border-top:1px solid #47677a;color:#a9c9cc}@media(max-width:900px){.columns{grid-template-columns:1fr}.main{padding:10px}}</style></head><body>
<header><h1>俄庇娜 · 世界自然地理主图重构实验</h1><p>对比从八片规整排布向大陆群聚、地峡、海峡和外洋群岛的视觉变化。中央超级大陆设定保持不变。</p></header>
<main class="main"><div class="controls"><a class="action" href="../images/orbina-v219-physical-world-redesign.svg" target="_blank">打开新版 SVG 原图</a><a class="action" href="../data/orbina-v219-redesign-spec.json">地图结构与候选约束</a></div>
<div class="toggles"><b>新版图层开关</b>
<label><input checked type="checkbox" data-layer="relief-layer">地势纹理</label>
<label><input checked type="checkbox" data-layer="candidate-island-chains">候选岛链</label>
<label><input checked type="checkbox" data-layer="candidate-connections">地峡标记</label>
<label><input checked type="checkbox" data-layer="geography-labels">地理文字</label>
<p id="status">SVG 页面载入后可调整可见图层。</p></div>
<div class="columns"><section class="panel old"><h2>之前：V2.18 大陆随机布局 B</h2>
<img src="../images/orbina-v218-random-layout-b.svg" alt="V2.18大陆错列布局" loading="lazy"/><div class="caption">陆块相互隔离，版式位置较规整。</div></section>
<section class="panel"><h2>新版：V2.19 非对称海陆组合</h2><object id="redesign" type="image/svg+xml" data="../images/orbina-v219-physical-world-redesign.svg" aria-label="新的可关闭候选层的地理主图"></object><div class="caption">外缘陆块相邻或由示意地峡连接，海岸浅水层、地势和外围岛链独立绘制。</div></section></div>
</main><footer>该版只用于观看和决定未来重绘方向。SVG 中的形状可以下载后继续编辑；网页图层开关不修改文件本身。</footer>
<script>(function(){"use strict";const obj=document.getElementById("redesign"),status=document.getElementById("status");let doc=null;const checks=[...document.querySelectorAll("[data-layer]")];function apply(){if(!doc)return;checks.forEach(function(c){const v=doc.getElementById(c.dataset.layer);if(v)v.style.display=c.checked?"inline":"none";});}obj.addEventListener("load",function(){try{doc=obj.contentDocument;if(!doc)throw Error("No SVG document");apply();status.textContent="地图已加载，图层可切换。";}catch(e){status.textContent="部分浏览器无法直接控制SVG图层；请打开原图。";}});checks.forEach(c=>c.addEventListener("change",apply));})();</script></body></html>
