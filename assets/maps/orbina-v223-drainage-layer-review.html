<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>俄庇娜 V2.23｜北部东缘河谷与山系</title><style>:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:#092636;color:#edf5e9}header{padding:22px 26px;background:#143b4c;border-bottom:1px solid #587b8f}h1{margin:0;font-size:clamp(23px,3vw,34px)}p{line-height:1.6;color:#b9d7d9}main{max-width:1580px;margin:auto;padding:20px}.tools{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}.tools a{display:inline-block;background:#21556a;border:1px solid #71919f;color:#eaf3e6;border-radius:8px;text-decoration:none;padding:9px 14px}.control{border:1px solid #638795;border-radius:12px;background:#143a4a;padding:15px;margin:12px 0}.control label{display:inline-flex;align-items:center;gap:8px;margin:6px 17px 6px 0;cursor:pointer}.control input{accent-color:#91d1be;width:19px;height:19px}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#133c4b;border-radius:12px;border:1px solid #5a8391;overflow:hidden}.card h2{margin:12px 14px;font-size:21px}.card img,.card object{display:block;width:100%;height:auto;aspect-ratio:2400/2730;object-fit:contain}.card p{font-size:13px;margin:9px 14px}.details{border:1px solid #638897;border-radius:12px;overflow:hidden;background:#143949;margin-top:18px}.details img{display:block;width:100%;height:auto}footer{border-top:1px solid #436c7a;padding:22px;color:#a7c9d0}@media(max-width:870px){.gallery{grid-template-columns:1fr}main{padding:11px}}</style></head><body>
<header><h1>俄庇娜 V2.23 · 山脉与河谷局部试绘</h1><p>北部两片、东缘三片候选陆地：主要溪流从内陆向海岸排出，各片之间不跨过新形成的裂海。</p></header>
<main><div class="tools"><a href="../images/orbina-v223-north-east-watershed.svg" target="_blank" rel="noopener">新版主图 SVG</a><a href="../images/orbina-v223-regional-drainage-panels.svg" target="_blank" rel="noopener">北部与东缘放大图</a><a href="../data/orbina-v223-north-east-drainage-proxy.json">排水候选 JSON</a></div>
<div class="control"><b>新版主图的独立图层</b><label><input checked type="checkbox" data-layer="candidate-local-drainage">候选溪流和高地</label>
<label><input checked type="checkbox" data-layer="candidate-ridge-correlations">相向山脊</label><label><input checked type="checkbox" data-layer="rift-water-shading">裂海色调</label>
<label><input type="checkbox" data-layer="original-outline-guides">碎裂前原岸线</label><p id="status">载入可编辑地图…</p></div>
<div class="gallery"><section class="card"><h2>V2.22：山脉与海峡</h2><img src="../images/orbina-v222-strait-headlands-orogeny.svg" alt="上一版裂海与山脉候选地图" loading="lazy"><p>已有相向山脊，但尚未独立形成排水溪流。</p></section>
<section class="card"><h2>V2.23：加入候选水系</h2><object id="atlas" type="image/svg+xml" data="../images/orbina-v223-north-east-watershed.svg" aria-label="北部东缘候选山脉与河谷世界地图"></object><p>17条候选溪流、相对高地视觉层和完整的中央正式地理关系。</p></section></div>
<section class="details"><img src="../images/orbina-v223-regional-drainage-panels.svg" alt="北部及东缘两个局部区域的候选河谷专题地图" loading="lazy"></section>
</main><footer>只做地理视觉与排水连通测试，不代表已确认的河流、湖泊、真实海拔、降水或洋盆归属。</footer>
<script>(function(){"use strict";const object=document.getElementById("atlas"),controls=[...document.querySelectorAll("[data-layer]")],status=document.getElementById("status");let doc=null;
function apply(){if(!doc)return;controls.forEach(function(c){const e=doc.getElementById(c.getAttribute("data-layer"));if(e)e.style.display=c.checked?"inline":"none";});}
object.addEventListener("load",function(){try{doc=object.contentDocument;if(!doc)throw Error("No frame");apply();status.textContent="已加载。切换图层不会改动保存的地图。";}catch(e){status.textContent="无法访问SVG内部，请直接打开原图。";}});
controls.forEach(c=>c.addEventListener("change",apply));})();</script></body></html>
