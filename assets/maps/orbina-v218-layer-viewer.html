<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>俄庇娜 V2.18 · 分层世界地图查看器</title>
<style>:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:#081f30;color:#eaf1ed}header{padding:19px 25px;background:#103145;border-bottom:1px solid #3b6979}h1{margin:0;font-size:clamp(20px,3vw,28px)}p{line-height:1.55;color:#bbd1d5}header p{margin:8px 0 0;font-size:13px}.layout{display:grid;grid-template-columns:minmax(255px,340px) minmax(0,1fr);min-height:85vh}aside{padding:20px;border-right:1px solid #356276;background:#0d2b3b}h2{margin:3px 0 16px;font-size:17px}.layer{display:flex;gap:12px;align-items:center;padding:11px 7px;border-bottom:1px solid #355767;cursor:pointer}.layer input{accent-color:#93cdc1;width:20px;height:20px;flex:none}.layer span{display:flex;flex-direction:column;gap:3px}.layer small{font-size:11px;color:#b8d0d3}main{min-width:0;padding:12px 16px 20px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:11px}.toolbar button,.toolbar a{padding:10px 13px;border-radius:8px;border:1px solid #5d8798;background:#174359;color:#f2f2e8;text-decoration:none;cursor:pointer;font-size:13px}.toolbar a:hover,.toolbar button:hover{background:#28617b}#status{font-size:12px;color:#b9d5d3;margin:8px 0}.mapbox{max-height:85vh;overflow:auto;border:1px solid #466b7d;border-radius:10px;background:#0a2a3b;text-align:center}object{width:min(100%,800px);height:auto;min-height:660px;aspect-ratio:2400/2600;display:block;margin:0 auto}footer{font-size:12px;color:#a9c9ce;padding:12px 24px;border-top:1px solid #365467}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #365467;padding:14px}.layer{display:inline-flex;width:calc(50% - 8px);vertical-align:top;padding:8px 3px}.layer small{font-size:10px}main{padding:8px}object{min-height:420px}}</style></head><body>
<header><h1>俄庇娜 · 分层世界地图 V2.18</h1><p>海陆、地形、水系、气候、地点与候选河口均可单独显示。正式的是设定关系，不是候选大陆的精确岸线。</p></header>
<div class="layout"><aside><h2>六类独立图层</h2><label class="layer"><input type="checkbox" data-layer="layer-land" checked><span><b>海陆轮廓</b><small>候选海岸，正式相对关系</small></span></label>
<label class="layer"><input type="checkbox" data-layer="layer-terrain" checked><span><b>地形高程</b><small>继承相对地貌，不是实测</small></span></label>
<label class="layer"><input type="checkbox" data-layer="layer-hydrology" checked><span><b>河流湖泊</b><small>R1/R2分离、棠溪河口未定</small></span></label>
<label class="layer"><input type="checkbox" data-layer="layer-climate" ><span><b>气候与生态</b><small>仅显示白石城定性季节标签</small></span></label>
<label class="layer"><input type="checkbox" data-layer="layer-polities" checked><span><b>国家与地点</b><small>标签不是城址或国境坐标</small></span></label>
<label class="layer"><input type="checkbox" data-layer="layer-candidates" checked><span><b>外围候选地貌</b><small>V2.17第2片外围大陆河口</small></span></label><p>气候层默认隐藏：现阶段尚未确定全球气候带。其他候选地貌可独立关闭。</p><p>这张地图的轮廓、路径和标签都保存在 SVG 矢量分组中，可以用 Inkscape 等编辑器修改。这里的网页只负责查看和显示控制。</p></aside>
<main><div class="toolbar"><button type="button" id="all">显示全部</button><button type="button" id="default">恢复默认</button><button type="button" id="hide-candidates">隐藏候选河口</button><button type="button" id="zoom-in">放大</button><button type="button" id="zoom-out">缩小</button><button type="button" id="reset-view">全图</button><a href="../images/orbina-v218-layered-master.svg" download>获取可编辑 SVG</a><a href="../data/orbina-v218-layer-manifest.json">图层说明 JSON</a></div>
<div id="status" role="status">加载矢量地图…</div><div class="mapbox"><object id="atlas" type="image/svg+xml" data="../images/orbina-v218-layered-master.svg" aria-label="俄庇娜六图层世界地图"></object></div></main></div>
<footer>制图单位尚不能换算为经纬度或公里。V2.17六处河口为候选叠加层，25个海域只有名称确定，没有统一海域边界。</footer>
<script>
(function(){
"use strict";
var object=document.getElementById("atlas"),status=document.getElementById("status"),original=[0,0,2400,2600],view=original.slice(),svg=null;
function checkBoxes(){return Array.from(document.querySelectorAll("[data-layer]"));}
function apply(){if(!svg)return;checkBoxes().forEach(function(c){var g=svg.getElementById(c.getAttribute("data-layer"));if(g)g.style.display=c.checked?"inline":"none";});}
function viewSet(){if(svg)svg.documentElement.setAttribute("viewBox",view.join(" "));}
object.addEventListener("load",function(){try{svg=object.contentDocument;if(!svg||!svg.documentElement)throw new Error("SVG unavailable");viewSet();apply();status.textContent="已加载6个可独立控制的SVG图层。";}catch(e){status.textContent="地图内容暂不可控制；可打开SVG文件直接查看。";}});
checkBoxes().forEach(function(el){el.addEventListener("change",apply);});
function defaultLayers(){checkBoxes().forEach(function(el){el.checked=el.getAttribute("data-layer")!=="layer-climate";});apply();}
document.getElementById("all").addEventListener("click",function(){checkBoxes().forEach(function(el){el.checked=true;});apply();});
document.getElementById("default").addEventListener("click",defaultLayers);
document.getElementById("hide-candidates").addEventListener("click",function(){var el=document.querySelector('[data-layer="layer-candidates"]');el.checked=false;apply();});
function zoom(f){var cx=view[0]+view[2]/2,cy=view[1]+view[3]/2,w=Math.max(320,Math.min(2400,view[2]*f)),h=w*2600/2400;view=[cx-w/2,cy-h/2,w,h];viewSet();}
document.getElementById("zoom-in").addEventListener("click",function(){zoom(.72);});
document.getElementById("zoom-out").addEventListener("click",function(){zoom(1/.72);});
document.getElementById("reset-view").addEventListener("click",function(){view=original.slice();viewSet();});
})();
</script></body></html>
