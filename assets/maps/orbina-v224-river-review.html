<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"/><title>俄庇娜 V2.24 · 河流整理对照</title>
<style>:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:#0a2939;color:#f0f3e9}header{padding:25px;background:#103748;border-bottom:1px solid #5a8292}h1{margin:0;font-size:clamp(22px,3vw,33px)}p{color:#b8d3d7;line-height:1.6}main{max-width:1610px;margin:auto;padding:18px}.actions{display:flex;flex-wrap:wrap;gap:11px;margin:14px 0}.actions a{padding:9px 14px;border-radius:8px;background:#24566b;color:#ebf2e5;border:1px solid #6e94a5;text-decoration:none}.controls{padding:17px;margin-bottom:20px;background:#153c4d;border:1px solid #568393;border-radius:13px}.controls label{display:inline-flex;align-items:center;gap:7px;margin:9px 16px 9px 0;cursor:pointer}.controls input{width:18px;height:18px;accent-color:#9bd2bb}.pairs{display:grid;grid-template-columns:1fr 1fr;gap:17px}.card{background:#143b4d;border:1px solid #658b99;border-radius:13px;overflow:hidden}.card h2{margin:13px 15px;font-size:21px}.card img,.card object{display:block;width:100%;height:auto;aspect-ratio:2400/2730;object-fit:contain}.card p{font-size:13px;margin:12px 15px}.detail{border:1px solid #597f8c;border-radius:12px;overflow:hidden;margin-top:20px;background:#123645}.detail img{display:block;width:100%;height:auto}footer{padding:20px;border-top:1px solid #547a88;color:#a9c9ce}@media(max-width:900px){main{padding:10px}.pairs{grid-template-columns:1fr}}</style></head><body>
<header><h1>俄庇娜 V2.24 · 主要河流与支流</h1><p>将17条各自向海的候选路线整理成7条主河，另外生成5条向下游汇入干流的支线；未显示的10条旧路线保留在数据中。</p></header>
<main><div class="actions"><a href="../images/orbina-v224-river-hierarchy-world.svg" target="_blank" rel="noopener">打开最新世界地图 SVG</a><a href="../images/orbina-v224-regional-river-hierarchy.svg" target="_blank" rel="noopener">查看两处局部放大图</a><a href="../data/orbina-v224-mainstem-tributary-network.json">河网结构数据</a></div>
<div class="controls"><b>新版图层开关</b>
<label><input checked type="checkbox" data-layer="candidate-main-rivers">7条主河</label>
<label><input checked type="checkbox" data-layer="candidate-tributaries">5条支流</label>
<label><input checked type="checkbox" data-layer="candidate-valley-relief">河谷视觉层</label>
<label><input checked type="checkbox" data-layer="candidate-river-labels">临时河流编号</label>
<label><input type="checkbox" data-layer="candidate-local-drainage">显示V2.23旧溪流图层</label>
<p id="status">正在读取矢量地图…</p></div>
<div class="pairs"><section class="card"><h2>V2.23：17条独立路线</h2><img src="../images/orbina-v223-north-east-watershed.svg" alt="V2.23旧版候选溪流" loading="lazy"/><p>溪流各自入海，缺乏真正的支流关系。</p></section>
<section class="card"><h2>V2.24：主河与支流</h2><object id="atlas" type="image/svg+xml" data="../images/orbina-v224-river-hierarchy-world.svg" aria-label="新版分层候选河网"></object><p>保留七条主要河道，五条新支流严格汇入对应的主河。</p></section></div>
<section class="detail"><img src="../images/orbina-v224-regional-river-hierarchy.svg" alt="北部与东缘两个区域的主支流放大图" loading="lazy"/></section></main>
<footer>候选河流编号不对应中央正式R1、R2。地图仍非实测地质、水文与真实全球气候图。</footer>
<script>(function(){"use strict";var atlas=document.getElementById("atlas"),inputs=[...document.querySelectorAll("[data-layer]")],status=document.getElementById("status"),svg=null;
function update(){if(!svg)return;inputs.forEach(function(c){var x=svg.getElementById(c.getAttribute("data-layer"));if(x)x.style.display=c.checked?"inline":"none";});}
atlas.addEventListener("load",function(){try{svg=atlas.contentDocument;if(!svg)throw Error();update();status.textContent="矢量地图已加载；图层可单独显示。";}catch(e){status.textContent="若浏览器无法控制嵌入图层，请查看完整SVG。";}});
inputs.forEach(c=>c.addEventListener("change",update));})();</script></body></html>
