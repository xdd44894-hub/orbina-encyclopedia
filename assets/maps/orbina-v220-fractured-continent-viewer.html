<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>俄庇娜V2.20｜破碎大陆全球地图</title>
<style>:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{background:#0b2838;color:#e9f2ed;margin:0}header{padding:23px 28px;background:#10384a;border-bottom:1px solid #477d8d}h1{font-size:clamp(24px,3vw,34px);margin:0}p{color:#bcd6d6;line-height:1.6}main{max-width:1580px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.card{background:#11384a;border-radius:13px;border:1px solid #58869a;overflow:hidden}.card h2{margin:15px;font-size:20px}.card img,.card object{width:100%;height:auto;display:block;aspect-ratio:2400/2730;object-fit:contain}.card.old img{aspect-ratio:2400/2780}.card p{padding:0 15px 13px;font-size:13px}.tools{margin:20px 0;padding:16px;border:1px solid #588395;border-radius:12px;background:#15394b}.tools label{display:inline-flex;align-items:center;gap:9px;margin:7px 15px 7px 0;cursor:pointer}.tools input{accent-color:#8bcdb9;width:19px;height:19px}a{color:#dcf0db}a.action{display:inline-block;padding:9px 13px;border-radius:9px;background:#20546a;border:1px solid #6895a5;text-decoration:none;margin-right:12px}footer{padding:22px;border-top:1px solid #45697a;color:#a9c9cd}@media(max-width:900px){.grid{grid-template-columns:1fr}main{padding:12px}}</style></head><body>
<header><h1>俄庇娜 V2.20 · 破碎大陆全球重构</h1><p>不必所有大陆都是完整的一块：主大陆、断裂次大陆、微大陆和岛链可以并存。仍保留中央的已确认世界观相对地理关系。</p></header>
<main><p><a class="action" href="../images/orbina-v220-fractured-continents-world.svg" target="_blank" rel="noopener">打开高清矢量地图</a><a class="action" href="../data/orbina-v220-fragmentation-plan.json">查看大陆拆分结构数据</a></p>
<div class="tools"><strong>新版图层对比</strong><p>打开“旧轮廓虚线”，可以看到原始完整陆块与目前裂片的差异。</p>
<label><input type="checkbox" data-layer="original-outline-guides">显示原大陆完整轮廓（橙色虚线）</label>
<label><input type="checkbox" data-layer="island-arcs" checked>显示候选岛链</label>
<label><input type="checkbox" data-layer="candidate-labels" checked>显示地理标注</label>
<label><input type="checkbox" data-layer="shelf-glows" checked>显示候选近岸浅水层</label>
<p id="status">正在载入 SVG…</p></div>
<div class="grid"><div class="card old"><h2>上一版：V2.19</h2><img src="../images/orbina-v219-physical-world-redesign.svg" alt="上一版完整大陆地峡布局" loading="lazy"><p>较多完整陆块，以三条试验地峡将不同地区硬连接。</p></div>
<div class="card"><h2>新版：V2.20</h2><object id="map" type="image/svg+xml" data="../images/orbina-v220-fractured-continents-world.svg" aria-label="可查看破碎陆块与岛链的世界地图"></object><p>保留主要大陆，以实际矢量剪切产生三条破碎陆缘，取消未经验证的地峡。</p></div></div>
</main><footer>图层开关只改变显示，不会覆盖仓库里的原始图。所有外围重组和分裂带均为候选方案，图上无比例尺与正式国界。</footer>
<script>(function(){"use strict";let svg=null;const el=document.getElementById("map"),status=document.getElementById("status"),checks=[...document.querySelectorAll("[data-layer]")];
function update(){if(!svg)return;checks.forEach(input=>{const group=svg.getElementById(input.getAttribute("data-layer"));if(group)group.style.display=input.checked?"inline":"none";});}
el.addEventListener("load",()=>{try{svg=el.contentDocument;if(!svg)throw Error();update();status.textContent="矢量地图已载入。";}catch(e){status.textContent="浏览器可能不支持内嵌SVG图层控制，请直接打开原图。";}});
checks.forEach(input=>input.addEventListener("change",update));})();</script></body></html>
