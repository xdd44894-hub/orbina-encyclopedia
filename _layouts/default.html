<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ '/' | relative_url }}">俄庇娜档案库</a>
  <nav aria-label="主导航">
    <a href="{{ '/catalog/' | relative_url }}">全部资料</a>
    <a href="{{ '/gallery/' | relative_url }}">图像原件</a>
    <a href="{{ '/about/' | relative_url }}">档案说明</a>
  </nav>
  <a class="repo-link" href="{{ site.github.repository_url | default: '#' }}">源仓库</a>
</header>
<main class="container">{{ content }}</main>
<footer class="footer"><span>俄庇娜世界观资料 · 条目保留来源信息</span><a href="{{ '/catalog/' | relative_url }}">全部资料</a></footer>
<script>window.WIKI_BASEURL={{ site.baseurl | jsonify }};</script>
<script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
</body>
</html>
