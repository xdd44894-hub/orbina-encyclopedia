title: 资料档案库
name: 资料档案库
description: 按来源、分类与条目检索的资料档案库。
url: https://xdd44894-hub.github.io
baseurl: /orbina-encyclopedia
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true
permalink: pretty
collections:
  articles:
    output: true
    permalink: /articles/:name/
defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: article
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
